name: Kufar Casio watch bot

on:
  schedule:
    # Каждые 10 минут. GitHub может слегка задерживать cron при высокой
    # нагрузке на свою инфраструктуру — это нормально и некритично здесь.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kufar-bot-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          # Необязательный секрет — если не добавлен в репозитории, здесь
          # просто будет пустая строка, и бот сам работает без ИИ-функций.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_RISK_TO_SUGGEST: ${{ vars.MAX_RISK_TO_SUGGEST }}
        run: python main.py

      - name: Save state back to the repository
        run: |
          git config user.name "kufar-bot"
          git config user.email "kufar-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновление состояния бота [skip ci]"
            git push
          else
            echo "Состояние не изменилось — нечего коммитить."
          fi
